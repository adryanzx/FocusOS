name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Localizar o projeto
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts nao encontrado. Envie o conteudo da pasta FocusOS para o repositorio."; exit 1
          fi
          DIR=$(dirname "$F")
          echo "Projeto em: $DIR"
          echo "PROJ=$DIR" >> "$GITHUB_ENV"
      - name: Gerar APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/saida/FocusOS.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FocusOS-apk
          path: saida/*.apk
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FocusOS build ${{ github.run_number }}
          body: APK gerado automaticamente a partir do commit ${{ github.sha }}.
          make_latest: true
          files: saida/FocusOS.apk
